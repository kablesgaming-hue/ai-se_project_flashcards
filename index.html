<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Flash Cards</title>

    <link rel="stylesheet" href="./assets/css/index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a href="#home" class="header__link">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li>
            <a href="#home" class="nav__link">My Decks</a>
          </li>
          <li>
            <a href="#about" class="nav__link">About</a>
          </li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section class="gallery" id="home">
        <h2 class="gallery__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>

          <button type="button" class="gallery__new-card-btn">
            + New Deck
          </button>
        </div>
      </section>
      <section class="new-deck-view" id="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>

        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-picker">
            <legend class="new-deck-view__legend">Pick the deck color</legend>

            <div class="new-deck-view__color-options">
              <label class="new-deck-view__color-label" for="green">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_green"
                  id="green"
                  type="radio"
                  name="color"
                  value="#64D583"
                  aria-label="Green"
                  checked
                />
              </label>

              <label class="new-deck-view__color-label" for="blue">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_blue"
                  id="blue"
                  type="radio"
                  name="color"
                  value="#91A8F9"
                  aria-label="Blue"
                />
              </label>

              <label class="new-deck-view__color-label" for="purple">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_purple"
                  id="purple"
                  type="radio"
                  name="color"
                  value="#AA8EF0"
                  aria-label="Purple"
                />
              </label>

              <label class="new-deck-view__color-label" for="pink">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_pink"
                  id="pink"
                  type="radio"
                  name="color"
                  value="#EE92D7"
                  aria-label="Pink"
                />
              </label>

              <label class="new-deck-view__color-label" for="orange">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_orange"
                  id="orange"
                  type="radio"
                  name="color"
                  value="#EE955E"
                  aria-label="Orange"
                />
              </label>

              <label class="new-deck-view__color-label" for="yellow">
                <input
                  class="new-deck-view__color-input new-deck-view__color-input_color_yellow"
                  id="yellow"
                  type="radio"
                  name="color"
                  value="#F5D770"
                  aria-label="Yellow"
                />
              </label>
            </div>
          </fieldset>

          <label class="new-deck-view__textarea-label">
            Write the JSON array of cards so that it matches this schema

            <textarea
              class="new-deck-view__textarea"
              name="deck-json"
              aria-label="Deck JSON"
            ></textarea>
          </label>

          <button class="new-deck-view__submit-btn" type="submit" disabled>
            Create the Deck
          </button>
        </form>
      </section>
      <template id="deck-template">
        <li class="card">
          <a href="#" class="card__link"></a>

          <div class="card__content">
            <h3 class="card__title"></h3>

            <div class="card__row">
              <p class="card__count"></p>

              <button
                type="button"
                class="card__delete-btn"
                aria-label="Delete this deck"
              ></button>
            </div>
          </div>
        </li>
      </template>
      <template id="card-template">
        <li class="card">
          <div class="card__content">
            <h3 class="card__title"></h3>

            <div class="card__row">
              <button
                type="button"
                class="card__flip-btn"
                aria-label="Flip card"
              ></button>

              <button
                type="button"
                class="card__delete-btn"
                aria-label="Delete card"
              ></button>
            </div>
          </div>
        </li>
      </template>
      <section id="deck-view" class="gallery">
        <div class="gallery__header">
          <h2 class="gallery__title"></h2>

          <button type="button" class="gallery__practice-btn">Practice</button>
        </div>

        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents"></ul>

          <button
            type="button"
            class="gallery__new-card-btn gallery__new-card-btn_location_deck-view"
          >
            + New Card
          </button>
        </div>
      </section>
      <section class="carousel" id="carousel">
        <h2 class="carousel__title">1 of 10 &middot; Basic HTML Tags</h2>

        <div class="carousel__grid">
          <button
            type="button"
            class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            aria-label="Previous card"
          ></button>

          <div class="carousel__card">
            <p class="carousel__card-text"></p>
          </div>

          <button
            type="button"
            class="carousel__btn carousel__btn_type_right"
            aria-label="Next card"
          ></button>

          <button
            type="button"
            class="carousel__btn carousel__btn_type_flip"
            aria-label="Flip card"
          ></button>
        </div>
      </section>
      <section class="not-found" id="not-found">
        <h2>404</h2>
        <p>Page not found</p>
      </section>
    </main>
    <div class="modal" id="error-modal">
      <div class="modal__content">
        <h2 class="modal__title">An error has occurred</h2>

        <p class="modal__error"></p>

        <button type="button" class="modal__close">Dismiss</button>
      </div>
    </div>
    <script type="module" src="./assets/js/index.js"></script>
    <footer class="footer">
      <p class="footer__text">&copy; 2026 Kenneth Robinette</p>
    </footer>
  </body>
</html>
